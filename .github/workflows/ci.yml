name: 🚀 DevOps Demo — CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: devops-demo
  PYTHON_VERSION: "3.10"

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Kod Kalitesi & Lint
  # ─────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install lint dependencies
        run: |
          pip install flake8 flake8-docstrings

      - name: 🔎 Run Flake8 (syntax & style check)
        run: |
          flake8 app.py load_generator.py \
            --max-line-length=120 \
            --ignore=E501,W503,D100,D101,D102,D103 \
            --statistics
        continue-on-error: false

  # ─────────────────────────────────────────────
  # JOB 2: Uygulama Testleri
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install application dependencies
        run: |
          pip install flask prometheus_client pytest requests

      - name: 🧪 Run smoke tests (endpoints)
        run: |
          # Flask uygulamasını arka planda başlat
          python app.py &
          APP_PID=$!

          # Servisin hazır olmasını bekle (max 30 sn)
          echo "⏳ Waiting for Flask to start..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
              echo "✅ Flask is UP!"
              break
            fi
            sleep 2
          done

          # Endpoint testleri
          echo "--- Testing endpoints ---"
          curl -sf http://localhost:5000/health        && echo "✅ /health OK"
          curl -sf http://localhost:5000/              && echo "✅ / OK"
          curl -sf http://localhost:5000/api/data      && echo "✅ /api/data OK"
          curl -sf http://localhost:5000/api/users     && echo "✅ /api/users OK"
          curl -sf http://localhost:5000/metrics       && echo "✅ /metrics OK"

          # /error endpoint 500 döndürmeli — bunu bekliyoruz
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/error)
          [ "$STATUS" = "500" ] && echo "✅ /error returned 500 (expected)" || (echo "❌ /error should return 500" && exit 1)

          # Prometheus metriklerinin var olduğunu doğrula
          curl -sf http://localhost:5000/metrics | grep -q "http_requests_total" && echo "✅ Metric http_requests_total found"
          curl -sf http://localhost:5000/metrics | grep -q "app_cpu_usage_percent" && echo "✅ Metric app_cpu_usage_percent found"

          kill $APP_PID
          echo "🎉 All smoke tests passed!"

  # ─────────────────────────────────────────────
  # JOB 3: Docker Build & Push
  # ─────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: 🔐 Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔬 Run Trivy security scan on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

  # ─────────────────────────────────────────────
  # JOB 4: Deployment Özeti
  # ─────────────────────────────────────────────
  summary:
    name: 📋 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, test, build-and-push]
    if: always()

    steps:
      - name: 📊 Print Pipeline Results
        run: |
          echo "============================================"
          echo "  🚀 DevOps Demo — CI/CD Pipeline Results"
          echo "============================================"
          echo ""
          echo "  Branch   : ${{ github.ref_name }}"
          echo "  Commit   : ${{ github.sha }}"
          echo "  Actor    : ${{ github.actor }}"
          echo "  Run #    : ${{ github.run_number }}"
          echo ""
          echo "  🔍 Lint       : ${{ needs.lint.result }}"
          echo "  🧪 Tests      : ${{ needs.test.result }}"
          echo "  🐳 Docker     : ${{ needs.build-and-push.result }}"
          echo ""
          echo "============================================"