global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts/rules.yml"

scrape_configs:

  # Flask Demo Uygulaması
  - job_name: "flask-demo-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:5000"]
        labels:
          app: "devops-demo"
          environment: "presentation"

  # Prometheus'un kendisini izleme
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"