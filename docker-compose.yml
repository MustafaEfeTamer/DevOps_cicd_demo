version: "3.8"

services:

  # ── Flask Demo Uygulaması ──────────────────────────────────────
  app:
    build: . # Lokal Dockerfile ile build (Docker Hub push gerekmez)
    container_name: devops_app
    ports:
      - "5000:5000"
    restart: unless-stopped

  # ── Prometheus ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts:/etc/prometheus/alerts # Alert kuralları
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle" # API ile reload: POST /-/reload
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - app

  # ── Grafana ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=user
      - GF_SECURITY_ADMIN_PASSWORD=user # Sınıfta göstermek için basit şifre
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/demo_dashboard.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning # Datasource + dashboard provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards # Dashboard JSON dosyaları
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus

  # ── Portainer ──────────────────────────────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9443:9443" # HTTPS UI
      - "9000:9000" # HTTP UI (yedek)
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock # Windows Docker Desktop
      - portainer_data:/data
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  portainer_data:
